<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Miniatura · Rise Again</title>
<style>
 body{background:#111;color:#eee;font:14px/1.6 -apple-system,system-ui;padding:24px;margin:0}
 canvas{width:960px;height:540px;display:block;border:1px solid #333;margin:12px 0}
 .peq{width:373px !important;height:210px !important;border:1px solid #444}
 button{font:inherit;padding:9px 16px;background:#fff;color:#000;border:0;cursor:pointer}
 #est{color:#8f8;margin-left:12px}
</style></head><body>
<canvas id="c"></canvas>
<canvas id="p" class="peq"></canvas>
<button onclick="guardar()">Guardar</button><span id="est"></span>

<script>
/* Mismo formato que las otras cuatro: portada a la izquierda, sesión a la
   derecha, diagonal blanca. Solo cambia el encuadre de la sesión, porque
   esta captura tiene el contenido en otra zona de la pantalla. */
const W=1920, H=1080, CORTE=0.47, D=105;   // D = apertura de la diagonal (70 a 1280px)
/* Esta captura tiene un bloque de pistas vacías en medio que se comía media
   miniatura. Se dibujan dos franjas de la MISMA sesión, con el mismo ancho y
   la misma escala, para que las pistas vacías no ocupen sitio. La costura cae
   en una línea de rejilla, así que no se ve. */
const SX = 0.33, SW = 0.35;
const FRANJAS = [ {sy:0.118, sh:0.270},    // Sub · Hasrd Bass · Rolling Bass · FX
                  {sy:0.535, sh:0.376} ];  // Pluck · Saw · Dubvision Lead · Piano

function cargar(s){return new Promise((ok,mal)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>mal(new Error(s));i.src=s;});}
function cubrir(cx,img,x,y,w,h,sesgoX){
  const r=Math.max(w/img.width,h/img.height), dw=img.width*r, dh=img.height*r;
  cx.drawImage(img,x+(w-dw)/2+(sesgoX||0),y+(h-dh)/2,dw,dh);
}

(async()=>{
  const c=document.getElementById("c"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  const [cov,ses]=await Promise.all([
    cargar("/herramientas/fuentes/cover-riseagain.jpg"),
    cargar("/herramientas/fuentes/ses-riseagain.jpg")]);

  x.save(); x.beginPath();
  x.moveTo(W*CORTE+D,0); x.lineTo(W,0); x.lineTo(W,H); x.lineTo(W*CORTE-D,H); x.closePath(); x.clip();
  const dx = W*CORTE-D, dw = W-dx;
  const total = FRANJAS.reduce((a,f)=>a+f.sh,0);
  let dy = 0;
  for(const f of FRANJAS){
    const dh = H * (f.sh/total);
    x.drawImage(ses, ses.width*SX, ses.height*f.sy, ses.width*SW, ses.height*f.sh,
                dx, dy, dw, dh);
    dy += dh;
  }
  x.restore();

  x.save(); x.beginPath();
  x.moveTo(0,0); x.lineTo(W*CORTE+D,0); x.lineTo(W*CORTE-D,H); x.lineTo(0,H); x.closePath(); x.clip();
  cubrir(x,cov,0,0,W*CORTE+D,H,-45);
  x.restore();

  x.strokeStyle="#fff"; x.lineWidth=13; x.lineCap="square";
  x.beginPath(); x.moveTo(W*CORTE+D,-15); x.lineTo(W*CORTE-D,H+15); x.stroke();

  const p=document.getElementById("p"); p.width=W; p.height=H;
  p.getContext("2d").drawImage(c,0,0);
  window.__listo=true;
  guardar();
})();

async function guardar(){
  const e=document.getElementById("est"); e.textContent="Guardando…";
  const datos=document.getElementById("c").toDataURL("image/jpeg",0.92);
  await fetch("/guardar",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({nombre:"yt-riseagain",datos})});
  e.textContent="✓ guardada";
}
</script></body></html>
