<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Generador de miniaturas</title>
<style>
 body{background:#111;color:#eee;font:14px/1.6 -apple-system,system-ui;padding:28px}
 h1{font-size:19px;margin:0 0 6px}
 p{color:#999;max-width:70ch}
 canvas{width:640px;height:360px;display:block;border:1px solid #333;margin:16px 0 6px}
 button{font:inherit;padding:10px 18px;background:#fff;color:#000;border:0;cursor:pointer}
 .est{color:#8f8;margin-left:12px}
</style></head><body>
<h1>Miniaturas de YouTube · 1280×720</h1>
<p>Portada a la izquierda, sesión de Ableton a la derecha, diagonal blanca —
   el formato que ya usabas. Se genera con las imágenes reales de cada proyecto.</p>
<div id="salida"></div>
<button onclick="guardar()">Guardar las tres</button><span class="est" id="est"></span>

<script>
const M = [
  {id:"blessings",    cover:"fuentes/cover-blessings.jpg",    ses:"../img/ses-blessings.jpg"},
  {id:"harmony",      cover:"fuentes/cover-harmony.jpg",      ses:"../img/ses-harmony.jpg"},
  {id:"caramelle",    cover:"fuentes/cover-caramelle.jpg",    ses:"../img/ses-caramelle.jpg"},
  {id:"takemethere",  cover:"fuentes/cover-takemethere.jpg",  ses:"../img/ses-takemethere.jpg"}
];
const W=1280, H=720, CORTE=0.47;   // dónde cruza la diagonal

function cargar(src){ return new Promise((ok,mal)=>{ const i=new Image();
  i.onload=()=>ok(i); i.onerror=()=>mal(new Error(src)); i.src=src; }); }

/* dibuja una imagen cubriendo un rectángulo, sin deformarla */
function cubrir(cx,img,x,y,w,h,sesgoX){
  const r = Math.max(w/img.width, h/img.height);
  const dw = img.width*r, dh = img.height*r;
  cx.drawImage(img, x + (w-dw)/2 + (sesgoX||0), y + (h-dh)/2, dw, dh);
}

async function pintar(m){
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  const [cov,ses]=await Promise.all([cargar(m.cover),cargar(m.ses)]);

  /* derecha: la sesión, ampliada para que los clips se lean a tamaño pequeño */
  x.save(); x.beginPath();
  x.moveTo(W*CORTE+70,0); x.lineTo(W,0); x.lineTo(W,H); x.lineTo(W*CORTE-70,H); x.closePath();
  x.clip();
  const zoom=1.9, sw=ses.width/zoom, sh=ses.height/zoom;
  x.drawImage(ses, ses.width*0.06, ses.height*0.18, sw, sh, W*CORTE-70, 0, W-(W*CORTE-70), H);
  x.restore();

  /* izquierda: la portada */
  x.save(); x.beginPath();
  x.moveTo(0,0); x.lineTo(W*CORTE+70,0); x.lineTo(W*CORTE-70,H); x.lineTo(0,H); x.closePath();
  x.clip();
  cubrir(x,cov,0,0,W*CORTE+70,H,-30);
  x.restore();

  /* la diagonal blanca */
  x.strokeStyle="#fff"; x.lineWidth=9; x.lineCap="square";
  x.beginPath(); x.moveTo(W*CORTE+70,-10); x.lineTo(W*CORTE-70,H+10); x.stroke();

  return c;
}

const hechos=[];
(async()=>{
  for(const m of M){
    const c=await pintar(m);
    const cont=document.createElement("div");
    cont.innerHTML="<b>"+m.id+"</b>";
    cont.appendChild(c);
    document.getElementById("salida").appendChild(cont);
    hechos.push({id:m.id,canvas:c});
  }
})();

async function guardar(){
  const e=document.getElementById("est"); e.textContent="Guardando…";
  for(const h of hechos){
    const datos=h.canvas.toDataURL("image/jpeg",0.92);
    await fetch("/api/imagen",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({nombre:"yt-"+h.id, tipo:"foto", datos})});
  }
  e.textContent="✓ Guardadas en img/yt-*.jpg";
}
</script></body></html>
