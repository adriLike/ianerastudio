<!doctype html><html><head><meta charset="utf-8"><title>Miniaturas a tamaño real</title>
<style>body{background:#0f0f0f;color:#eee;font:13px system-ui;padding:26px}
 .fila{display:flex;gap:26px;align-items:flex-start;margin-bottom:26px}
 figure{margin:0} img{display:block;border-radius:8px}
 .s210 img{width:210px} .s360 img{width:360px} .s640 img{width:640px}
 figcaption{color:#aaa;margin-top:6px;font-size:11px}
 h2{font-size:15px;margin:24px 0 10px;color:#fff}</style></head><body>
<h2>210 px — barra lateral de YouTube (el tamaño que más se ve)</h2>
<div class="fila s210">
 <figure><img src="fuentes/yt-harmony.jpg"><figcaption>Harmony</figcaption></figure>
 <figure><img src="fuentes/yt-caramelle.jpg"><figcaption>Caramelle</figcaption></figure>
 <figure><img src="fuentes/yt-takemethere.jpg"><figcaption>Take Me There</figcaption></figure>
</div>
<h2>360 px — resultados de búsqueda</h2>
<div class="fila s360">
 <figure><img src="fuentes/yt-harmony.jpg"></figure>
 <figure><img src="fuentes/yt-caramelle.jpg"></figure>
</div>
</body></html>
